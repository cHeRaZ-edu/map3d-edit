name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      # Si falla, deja los errores del compilador como anotaciones (legibles por API)
      - name: Report compile errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A2 build.log | head -40 | sed 's/^/::error::/' || true

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk map3d-edit-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: map3d-edit-debug
          path: map3d-edit-debug.apk

      # Release "latest" para bajar el APK directo desde el cel (sin entrar a Artifacts)
      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest debug build
          prerelease: true
          files: map3d-edit-debug.apk
